[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formula-map"
version = "0.1.0"
description = "Inspect Excel formulas and their cell dependencies"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "openpyxl>=3.1",
    "streamlit>=1.40",
]

[project.scripts]
formula-map = "formula_map.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]